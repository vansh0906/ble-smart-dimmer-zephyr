CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=n
CONFIG_BT_DEVICE_NAME="test phone"
CONFIG_BT_MAX_CONN=1
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y
CONFIG_ASSERT=y
# the test checks the server rejects unencrypted writes, so no automatic pair-and-retry
CONFIG_BT_ATT_RETRY_ON_SEC_ERR=n
